spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB.URL}
    username: ${DB.USERNAME}
    password: ${DB.PASSWORD}
  h2:
    console:
      enabled: true

  application:
    name: ticketaka

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect # PostgreSQL 사용
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT.SECRET}

logging:
  level:
    '[ticketaka]': debug
    '[org.hibernate.type]': trace

server:
  port: 7878