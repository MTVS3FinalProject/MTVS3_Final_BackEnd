spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE.URL}
    username: ${DATABASE.USERNAME}
    password: ${DATABASE.PASSWORD}
  data:
    redis:
      host: clustercfg.ticketaka-redis-cluster.9ukk7l.memorydb.ap-northeast-2.amazonaws.com
      port: 6379
  h2:
    console:
      enabled: true

  application:
    name: ticketaka

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect # PostgreSQL 사용
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT.SECRET}

logging:
  level:
    '[ticketaka]': debug
    '[org.hibernate.type]': trace

server:
  port: 8080