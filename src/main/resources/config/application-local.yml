spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  application:
    name: ticketaka

  jpa:
    show-sql: true
    database: mysql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

cloud:
  aws:
    credentials:
      accessKey: ${AWS.ACCESS.KEY}
      secretKey: ${AWS.SECRET.KEY}
    s3:
      bucket: ${AWS.S3.BUCKET}
    region:
      static: ${AWS.REGION}
    stack:
      auto: false



jwt:
  secret: ${JWT.SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs

  show-actuator: true

logging:
  level:
    '[ticketaka]': debug
    '[org.hibernate.type]': trace